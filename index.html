<script>
(()=>{
 const el=id=>document.getElementById(id);
 const status=(pl,en)=>el('cloudStatus').textContent=(prefs.language==='en'?en:pl);
 window.cloudLabels=()=>{
  el('cloudLabel').textContent=prefs.language==='en'?'Cloud synchronization':'Synchronizacja w chmurze';
  el('cloudLogin').textContent=prefs.language==='en'?'Sign in with Google':'Zaloguj przez Google';
  el('cloudLogout').textContent=prefs.language==='en'?'Sign out':'Wyloguj';
 };
 window.cloudLabels();
 const c=window.GOTO_FIREBASE_CONFIG;
 if(!c||!c.apiKey||c.apiKey==='WPISZ_API_KEY'){
  status('Najpierw skonfiguruj Firebase (plik firebase-config.js).','Configure Firebase first (firebase-config.js).');
  el('cloudLogin').disabled=true;return;
 }
 if(!window.firebase){status('Nie udało się załadować Firebase.','Could not load Firebase.');return;}
 let app,auth,db,unsub=null,ready=false,loading=false,saveTimer=null,docRef=null;
 try{app=firebase.initializeApp(c);auth=firebase.auth();db=firebase.firestore();}

  if(!ready||loading||!docRef)return;

  saveTimer=setTimeout(()=>docRef.set({items:items,prefs:prefs,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .catch(e=>status('Błąd zapisu: '+e.message,'Save error: '+e.message)),400);

 el('cloudLogin').onclick=async()=>{
  try{
   const provider=new firebase.auth.GoogleAuthProvider();
   await auth.signInWithPopup(provider);
  }catch(e){
   if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){
    try{await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());return}catch(err){e=err}

  el('cloudLogout').classList.toggle('hidden',!user);

  status('Łączenie z chmurą…','Connecting to cloud…');
  docRef=db.collection('users').doc(user.uid).collection('data').doc('favorites');
  let first=true;
  unsub=docRef.onSnapshot(snap=>{
